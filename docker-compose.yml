version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: packd_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://packd_user:packd_pass@postgres:5432/packd_db
      - SECRET_KEY=packd-super-secret-key-change-in-production-sih2026-xyz789
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","*"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: packd_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: packd_postgres
    environment:
      POSTGRES_USER: packd_user
      POSTGRES_PASSWORD: packd_pass
      POSTGRES_DB: packd_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U packd_user -d packd_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: packd_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: